<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="style/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore</title>
</head>

<body>

    <header>
        <div class="container">
            <div class="in-header">
                <a class="logo" href="index.html">TechStore</a>
                <nav>
                    <a class="nav_link" href="#products-section">Товари</a>
                    <a class="nav_link" href="#contacts-section">Контакти</a>
                    <a class="nav_link" href="cart.html">Кошик</a>
                </nav>

            </div>
        </div>
    </header>

    <main>
        <div class="cart-notification" style="display:none; opacity:0;">
            <p>Повідомлення</p>
            <p>Товар додано до кошика!</p>
            <button class="to-cart add-to-cart-btn" id="to-cart-btn">Перейти до кошика</button>
        </div>

        <div class="overlay"></div>
        <div class="details" id="details">
            <img class="product-img" src="" alt="Зображення товару">
            <h2 class="product-title"></h2>
            <p class="product-price"></p>
            <button class="add-to-cart-btn" data-id="">Додати до кошика</button>
            <button class="back-btn">Назад</button>
            <p class="product-description"></p>
        </div>

        <section id="products-section"></section>

        <div class="container-for-canging-text">

            <span>
                У нас тут є
                <span class="changing-text"></span>
            </span>

        </div>

        <section class="filters">
            <input id="search-input" type="search" placeholder="Пошук за назвою або брендом...">
            <select id="type-filter">
                <option value="">Всі типи</option>
            </select>
            <select id="brand-filter">
                <option value="">Всі бренди</option>
            </select>
            <select id="price-filter">
                <option value="">Всі ціни</option>
                <option value="0-10000">До 10 000 грн</option>
                <option value="10000-25000">10 000 - 25 000 грн</option>
                <option value="25000-60000">25 000 - 60 000 грн</option>
                <option
                    value="60000-99999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999 9999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999">
                    Більше 60 000 грн</option>
            </select>
        </section>

        <div class="products" id="products"></div>

    </main>

    <footer>

        <section id="contacts-section">

            <p>
                Напишіть ваш номер телефону,
                і ми зв'яжемося з вами:
            </p>

            <input type="number" placeholder="номер телефону без +38" id="phone-input">

            <button id="call-btn" class="call-btn">
                Зателефонувати
            </button>

        </section>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
